# ==== نظام المهام: بداية ====
# استثناءات ModSecurity/CRS لطلبات التطبيق السليمة.
# تُدرج تلقائيًا في REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf عبر: sudo task nginx
# قاعدة: لا نعطّل WAF — نضيف استثناءً محدّدًا لكل حجب خاطئ مُثبَت فقط.
# لمعرفة رقم القاعدة التي حجبت طلبًا:  sudo grep 'Access denied' /var/log/nginx/error.log | tail
# المعرّفات: 9000100–9000119 المرحلة 1 · 9000110–9000111 المرفقات (م2) · 9000120 الملفات الثابتة

# مسارات الـ API تستقبل JSON عربيًا؛ قواعد تشفير النصوص تعطي إنذارات كاذبة عليه.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:9000100,phase:1,pass,nolog,ctl:ruleRemoveById=920420,ctl:ruleRemoveById=920300"

# الـ API يستخدم PUT/PATCH/DELETE (REST)؛ CRS الافتراضي يسمح بـ GET/POST/HEAD/OPTIONS فقط (القاعدة 911100)
# نوسّع القائمة على مسارات /api/ فقط — بقية الموقع تبقى على الافتراضي.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:9000105,phase:1,pass,nolog,t:none,setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# (م2) رفع المرفقات: POST /api/v1/tasks/<uuid>/attachments (multipart، حتى 10 MB — التحقق من النوع/الحجم في الـ API)
#  - 200002/200004: صرامة multipart التي تحجب رفعًا سليمًا من بعض المتصفحات
#  - قواعد الحقن (SQLi/XSS/RCE/PHP/LFI) تفحص اسم الملف ومحتواه النصي كمدخلات فتحجب CSV/Markdown بريئة —
#    نزيل أهدافها FILES و FILES_NAMES على هذا المسار فقط؛ كل ما عداه يبقى مفعّلًا.
SecRule REQUEST_URI "@rx ^/api/v1/tasks/[0-9a-fA-F-]{36}/attachments$" \
    "id:9000110,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveById=200002,ctl:ruleRemoveById=200004,\
    ctl:ruleRemoveTargetByTag=attack-sqli;FILES,\
    ctl:ruleRemoveTargetByTag=attack-sqli;FILES_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-xss;FILES,\
    ctl:ruleRemoveTargetByTag=attack-xss;FILES_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-rce;FILES,\
    ctl:ruleRemoveTargetByTag=attack-rce;FILES_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;FILES,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;FILES_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-lfi;FILES_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-generic;FILES_NAMES,\
    ctl:ruleRemoveTargetByTag=attack-protocol;FILES_NAMES"

# ملفات Next.js الثابتة لا تحتاج فحصًا
SecRule REQUEST_URI "@beginsWith /_next/static" \
    "id:9000120,phase:1,pass,nolog,ctl:ruleEngine=Off"
# ==== نظام المهام: نهاية ====
