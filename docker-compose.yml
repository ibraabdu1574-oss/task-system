# نظام إدارة المهام — بيئة التطوير على خادم DigitalOcean
# كل منفذ منشور مربوط بـ 127.0.0.1 صراحةً؛ الوصول الخارجي عبر nginx/443 فقط.
# الأسرار من .env (يُولَّد بـ: task env) — لا قيم سرّية هنا.

name: taskapp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?شغّل task env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?شغّل task env}
      POSTGRES_DB: ${POSTGRES_DB:?شغّل task env}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?شغّل task env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TZ: Asia/Riyadh
    volumes:
      # hot reload: المصدر فقط — node_modules تبقى داخل الصورة (تُحدَّث مع task deploy)
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/test:/app/apps/api/test
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      # الواجهة تنادي الـ API عبر nginx بنفس الأصل (/api) — لا منفذ مكشوف
      NEXT_PUBLIC_API_BASE: /api/v1
      # من داخل الحاوية (طلبات الخادم) تصل للـ API مباشرة
      API_INTERNAL_URL: http://api:3001/api/v1
      TZ: Asia/Riyadh
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/shared/src:/app/packages/shared/src
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  pgdata:
  redisdata:
